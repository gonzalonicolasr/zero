name: zero-pi CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/zero-pi/**'
      - '.github/workflows/zero-pi-ci.yml'
  pull_request:
    paths:
      - 'packages/zero-pi/**'
      - '.github/workflows/zero-pi-ci.yml'

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/zero-pi
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: npm run pack-check
